name: ci

# Quality gate on every pull request and on pushes to `main`. Cross-platform behaviour is a hard
# invariant of this repository (the connector runs beside `worc watch` on Windows, macOS and Linux),
# so the test suite runs NATIVELY on all three; the static gates stay on Ubuntu, where re-running them
# per OS would add cost without adding signal. The suite never launches the real `gh` or `worc`: every
# integration test drives a fake executable, so CI is deterministic and credential-free. The Markdown
# gate is a local pre-commit hook until its linter is published.
on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref cancels the in-flight run (the latest commit wins).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static gates (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (with dev deps)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format (ruff format --check)
        run: ruff format --check .

      - name: Types (mypy)
        run: mypy src

      - name: Import contracts (import-linter)
        run: lint-imports

      - name: Module line budgets (size gate)
        run: python tools/size_gate.py

      - name: Docstring coverage (interrogate)
        run: interrogate src

      - name: Dead code (vulture)
        run: vulture

      - name: Dependency hygiene (deptry)
        run: deptry src

  test:
    name: tests (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu covers the declared Python floor (requires-python = ">=3.12") plus the next minor;
        # Windows and macOS run the primary version — enough to prove native cross-platform parity
        # without doubling the most expensive minutes.
        include:
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: ubuntu-latest, python-version: "3.13" }
          - { os: windows-latest, python-version: "3.13" }
          - { os: macos-latest, python-version: "3.13" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (with dev deps)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests (pytest)
        run: pytest -q
