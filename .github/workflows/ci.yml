name: ci

# Quality gate on every pull request and on pushes to `main`. Cross-platform behaviour is a hard
# invariant of this repository (the connector runs beside `worc watch` on Windows, macOS and Linux),
# so the test suite runs NATIVELY on all three; the static gates stay on Ubuntu, where re-running them
# per OS would add cost without adding signal. The suite never launches the real `gh` or `worc`: every
# integration test drives a fake executable, so CI is deterministic and credential-free. worc itself
# is installed in the test job all the same — imported, never launched, so that the generated task
# file is judged by its real validation gate. The Markdown gate runs here too, in its own job: its
# linter is a published npm package, so the gate is no longer only as strong as a contributor's
# pre-commit hook.
on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref cancels the in-flight run (the latest commit wins).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static gates (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (with dev deps)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format (ruff format --check)
        run: ruff format --check .

      - name: Types (mypy)
        run: mypy src

      - name: Import contracts (import-linter)
        run: lint-imports

      - name: Module line budgets (size gate)
        run: python tools/size_gate.py

      - name: Docstring coverage (interrogate)
        run: interrogate src

      - name: Dead code (vulture)
        run: vulture

      - name: Dependency hygiene (deptry)
        run: deptry src

  markdown:
    name: markdown gate (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The linter requires >= 24.17.0 (all three @wastech-mdlint packages declare it).
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      # tools/mdlint.py is a stdlib-only script, so the project itself is never installed here — this
      # step only guarantees that `python` resolves, which is not true of a bare Ubuntu runner.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # `npm ci` installs exactly the lockfile, so the gate cannot change meaning between this run and
      # a contributor's without the lockfile change being visible in the diff.
      - name: Install the linter (npm ci)
        run: npm ci

      # The same entry point the pre-commit hook runs, so the two can never drift apart. Under CI the
      # script exits 2 rather than skipping when the linter is missing: a gate that reports success
      # for a pass it never ran is worse than a red one.
      - name: Markdown gate (wastech-mdlint)
        run: python tools/mdlint.py

  test:
    name: tests (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu covers the declared Python floor (requires-python = ">=3.12") plus the next minor;
        # Windows and macOS run the primary version — enough to prove native cross-platform parity
        # without doubling the most expensive minutes.
        include:
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: ubuntu-latest, python-version: "3.13" }
          - { os: windows-latest, python-version: "3.13" }
          - { os: macos-latest, python-version: "3.13" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-worc.txt

      - name: Install (with dev deps)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # worc, from its repository, so the suite that feeds a generated task file to worc's real
      # validation gate actually runs here instead of skipping. Its own step because it cannot be a
      # dependency in `pyproject.toml`: it is published to no index, and a direct reference in the
      # project's metadata is refused by the build backend and by every index. See
      # requirements-worc.txt.
      - name: Install worc (test dependency, from its repository)
        run: pip install -r requirements-worc.txt

      - name: Tests (pytest)
        run: pytest -q
